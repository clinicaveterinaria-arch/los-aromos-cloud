{% extends 'base.html' %}{% block content %}<h1>Historia clínica</h1><div class="card"><form method="get"><label>Buscar por paciente, propietario o teléfono</label><div class="row"><input name="q" value="{{ q }}" placeholder="Ej: Luna, Pérez, 345..."><button class="btn">Buscar</button></div></form></div><div class="card"><h2>Resultados</h2><table><tr><th>Paciente</th><th>Propietario</th><th>Teléfono</th><th></th></tr>{% for p in results %}<tr><td>{{ p.name }}</td><td>{{ p.owner.full_name }}</td><td>{{ p.owner.phone }}</td><td><a class="btn" href="/patients/{{ p.id }}">Abrir</a></td></tr>{% endfor %}</table></div>{% endblock %}
