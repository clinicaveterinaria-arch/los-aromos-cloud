{% extends "base.html" %}

{% block content %}

<div style="padding:24px;">

    <div style="background:white;border:1px solid #f3c6d8;border-radius:22px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.04);max-width:800px;">

        <h1 style="margin-top:0;color:#1f2937;">✏️ Editar marca comercial</h1>

        <form method="post" action="/vademecum/brand/{{ brand.id }}/edit">

            <label>Nombre comercial</label>
            <input name="brand_name" value="{{ brand.brand_name or '' }}" style="width:100%;margin-bottom:10px;padding:10px;border:1px solid #f3c6d8;border-radius:10px;">

            <label>Laboratorio</label>
            <input name="laboratory" value="{{ brand.laboratory or '' }}" style="width:100%;margin-bottom:10px;padding:10px;border:1px solid #f3c6d8;border-radius:10px;">

            <label>Presentación</label>
            <input name="presentation" value="{{ brand.presentation or '' }}" style="width:100%;margin-bottom:10px;padding:10px;border:1px solid #f3c6d8;border-radius:10px;">

            <label>Concentración</label>
            <input name="concentration" value="{{ brand.concentration or '' }}" style="width:100%;margin-bottom:14px;padding:10px;border:1px solid #f3c6d8;border-radius:10px;">

            <button type="submit" style="background:#22c55e;color:white;border:none;border-radius:12px;padding:12px 16px;font-weight:bold;">
                💾 Guardar cambios
            </button>

            <a href="/vademecum" style="background:#d85b9a;color:white;border-radius:12px;padding:12px 16px;text-decoration:none;font-weight:bold;margin-left:8px;">
                Volver
            </a>

        </form>

    </div>

</div>

{% endblock %}
