{% extends 'base.html' %}
{% block content %}

<h1>✏️ Editar paciente y propietario</h1>

<div class="panel">

    <form method="post" action="/patients/{{ patient.id }}/edit">

        <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px;">

            <div style="background:#fff0f5; border:1px solid #f3c6d8; border-radius:12px; padding:16px;">
                <h3>🐾 Datos del paciente</h3>

                <label><b>Nombre</b></label>
                <input name="name" value="{{ patient.name }}" required>

                <label><b>Especie</b></label>
                <input name="species" value="{{ patient.species or '' }}">

                <label><b>Raza</b></label>
                <input name="breed" value="{{ patient.breed or '' }}">

                <label><b>Sexo</b></label>
                <input name="sex" value="{{ patient.sex or '' }}">

                <label><b>Fecha de nacimiento</b></label>
                <input type="date"
                       name="birth_date"
                       value="{{ patient.birth_date.strftime('%Y-%m-%d') if patient.birth_date else '' }}">

                <label><b>Peso</b></label>
                <input name="weight" value="{{ patient.weight or '' }}">

                <label><b>Alertas</b></label>
                <input name="alerts" value="{{ patient.alerts or '' }}">

                <label><b>Notas</b></label>
                <textarea name="notes">{{ patient.notes or '' }}</textarea>
            </div>

            <div style="background:#f7f7f7; border:1px solid #ddd; border-radius:12px; padding:16px;">
                <h3>👤 Datos del propietario</h3>

                <input type="hidden" name="owner_id" value="{{ patient.owner.id }}">

                <label><b>Nombre del propietario</b></label>
                <input name="owner_name" value="{{ patient.owner.name if patient.owner else '' }}">

                <label><b>Teléfono</b></label>
                <input name="owner_phone" value="{{ patient.owner.phone if patient.owner else '' }}">

                <label><b>WhatsApp</b></label>
                <input name="owner_whatsapp" value="{{ patient.owner.whatsapp if patient.owner else '' }}">

                <label><b>Email</b></label>
                <input name="owner_email" value="{{ patient.owner.email if patient.owner else '' }}">

                <label><b>Dirección</b></label>
                <input name="owner_address" value="{{ patient.owner.address if patient.owner else '' }}">
            </div>

        </div>

        <br>

        <button type="submit" class="btn">💾 Guardar cambios</button>
        <a href="/patients/{{ patient.id }}" class="btn">Cancelar</a>

    </form>

</div>

{% endblock %}
