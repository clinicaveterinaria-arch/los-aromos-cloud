{% extends 'base.html' %}{% block content %}<h1>Nuevo paciente</h1><div class="card"><form method="post"><label>Propietario</label><select name="owner_id" required>{% for o in owners %}<option value="{{ o.id }}">{{ o.full_name }} - {{ o.phone }}</option>{% endfor %}</select><div class="row"><div><label>Nombre paciente</label><input name="name" required></div><div><label>Especie</label><input name="species" placeholder="Canino/Felino"></div></div><div class="row"><div><label>Raza</label><input name="breed"></div><div><label>Sexo</label><input name="sex"></div></div><div class="row"><div><label>Peso</label><input name="weight" type="number" step="0.01"></div><div><label>Alertas clínicas</label><input name="alerts"></div></div><label>Observaciones</label><textarea name="notes"></textarea><button class="btn">Guardar paciente</button></form></div>{% endblock %}
