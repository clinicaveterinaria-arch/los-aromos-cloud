services:
  - type: web
    name: los-aromos-cloud
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: los-aromos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
