{% extends 'base.html' %}{% block content %}<h1>Propietarios</h1><div class="card"><h2>Nuevo propietario</h2><form method="post" action="/owners/new"><div class="row"><div><label>Nombre y apellido</label><input name="full_name" required></div><div><label>Teléfono</label><input name="phone"></div></div><div class="row"><div><label>WhatsApp</label><input name="whatsapp"></div><div><label>Email</label><input name="email"></div></div><label>Dirección</label><input name="address"><label>Observaciones</label><textarea name="notes"></textarea><button class="btn">Guardar propietario</button></form></div><div class="card"><h2>Listado</h2><table><tr><th>Nombre</th><th>Teléfono</th><th>Pacientes</th></tr>{% for o in owners %}<tr><td>{{ o.full_name }}</td><td>{{ o.phone }}</td><td>{% for p in o.patients %}<a href="/patients/{{ p.id }}">{{ p.name }}</a>{% if not loop.last %}, {% endif %}{% endfor %}</td></tr>{% endfor %}</table></div>{% endblock %}
