<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Login - Los Aromos</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="login-body">
  <div class="login-card">
    <img src="/static/logo.jpg" class="login-logo">
    <h1>Los Aromos Cloud</h1>
    <p>Sistema de gestión veterinaria</p>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label>Usuario</label><input name="username" value="admin" required>
      <label>Clave</label><input name="password" type="password" required>
      <button>Ingresar</button>
    </form>
  </div>
</body></html>
